[project]
name = "salon-booking-agent"
version = "0.1.0"
description = "Salon appointment assistant: LangChain create_agent with human approval for bookings"
authors = [{ name = "Berke Akyıldız" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langsmith>=0.14.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
salon-seed = "salon_booking_agent.seed:main"
salon-chat = "salon_booking_agent.demo:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
